<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="TerraMind — AI agriculture intelligence for every stage: crop and yield advisory, growth-stage monitoring, disease diagnosis, and a knowledge-grounded farming assistant."
    />
    <meta name="theme-color" content="#F0FDF4" />
    <title>TerraMind — Smarter Farming, Every Stage</title>

    <!--
      Fonts are self-hosted via @fontsource-variable/plus-jakarta-sans and
      imported from main.tsx. The previous Google Fonts <link> was a
      render-blocking request to a third-party origin; removing it drops two DNS
      lookups and a TLS handshake from the critical path.
    -->

    <script>
      /*
        Applies the stored theme before first paint. Without this, a user who
        chose dark mode sees a full-page white flash on every load, which is
        both jarring and painful at night. Kept inline and tiny on purpose --
        it must run before the bundle is fetched.
      */
      (function () {
        try {
          var stored = localStorage.getItem('terramind-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08130D');
          }
        } catch (e) {
          /* localStorage can throw in private mode; light is a safe default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
